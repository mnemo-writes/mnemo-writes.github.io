<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diffusion-Limited Aggregation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #c8c8d0;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
canvas {
  display: block;
  cursor: crosshair;
}
.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 13px;
  background: rgba(10, 10, 15, 0.85);
  padding: 10px 18px;
  border-radius: 8px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(200, 200, 208, 0.1);
  z-index: 10;
}
.controls label {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.controls input[type="range"] {
  width: 80px;
  accent-color: #a0b8d8;
}
.controls button {
  background: rgba(160, 184, 216, 0.15);
  border: 1px solid rgba(160, 184, 216, 0.3);
  color: #c8c8d0;
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}
.controls button:hover {
  background: rgba(160, 184, 216, 0.25);
}
.info {
  position: fixed;
  top: 16px;
  left: 16px;
  font-size: 13px;
  line-height: 1.5;
  color: rgba(200, 200, 208, 0.5);
  z-index: 10;
}
.info kbd {
  background: rgba(200, 200, 208, 0.1);
  border: 1px solid rgba(200, 200, 208, 0.15);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 12px;
}
.stats {
  position: fixed;
  top: 16px;
  right: 16px;
  font-size: 13px;
  line-height: 1.5;
  color: rgba(200, 200, 208, 0.4);
  text-align: right;
  z-index: 10;
}
</style>
</head>
<body>
<div class="info">
  Click to seed. <kbd>Space</kbd> pause. <kbd>R</kbd> reset. <kbd>C</kbd> toggle color.
</div>
<div class="stats" id="stats"></div>
<canvas id="canvas"></canvas>
<div class="controls">
  <label>Walkers: <input type="range" id="walkerCount" min="100" max="5000" step="100" value="1000"><span id="walkerCountVal">1000</span></label>
  <label>Stickiness: <input type="range" id="stickiness" min="0.05" max="1.0" step="0.05" value="1.0"><span id="stickinessVal">1.0</span></label>
  <button id="resetBtn">Reset</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');

let SZ, grid, arrival, clusterSize, maxRadius, imageData;
let paused = false;
let colorMode = 0;
let animId;
let walkers;
let nextArrival;

const params = {
  walkerCount: 1000,
  stickiness: 1.0,
  spawnMargin: 10,
  killMargin: 40,
};

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight);
  canvas.width = s;
  canvas.height = s;
  SZ = s;
}

function init() {
  resize();
  grid = new Uint8Array(SZ * SZ);
  arrival = new Float32Array(SZ * SZ);
  imageData = ctx.createImageData(SZ, SZ);
  clusterSize = 0;
  maxRadius = 2;
  nextArrival = 1;
  walkers = [];

  const cx = SZ >> 1;
  const cy = SZ >> 1;
  addSeed(cx, cy);
}

function addSeed(x, y) {
  x = Math.round(x);
  y = Math.round(y);
  if (x < 0 || x >= SZ || y < 0 || y >= SZ) return;
  const idx = y * SZ + x;
  if (grid[idx]) return;
  grid[idx] = 1;
  arrival[idx] = nextArrival++;
  clusterSize++;
  const cx = SZ >> 1;
  const cy = SZ >> 1;
  const r = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
  if (r + 5 > maxRadius) maxRadius = r + 5;
}

function spawnWalker() {
  const angle = Math.random() * Math.PI * 2;
  const r = maxRadius + params.spawnMargin;
  const cx = SZ >> 1;
  const cy = SZ >> 1;
  return {
    x: cx + Math.cos(angle) * r,
    y: cy + Math.sin(angle) * r,
  };
}

function hasNeighbor(x, y) {
  const ix = Math.round(x);
  const iy = Math.round(y);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = ix + dx;
      const ny = iy + dy;
      if (nx >= 0 && nx < SZ && ny >= 0 && ny < SZ && grid[ny * SZ + nx]) {
        return true;
      }
    }
  }
  return false;
}

function stepWalkers() {
  const cx = SZ >> 1;
  const cy = SZ >> 1;
  const killR = maxRadius + params.killMargin;
  const killR2 = killR * killR;
  let stuck = 0;

  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i];

    const dcx = w.x - cx;
    const dcy = w.y - cy;
    const distCenter = Math.sqrt(dcx * dcx + dcy * dcy);
    const gap = distCenter - maxRadius;

    if (gap > 3) {
      const jumpR = gap - 2;
      const a = Math.random() * Math.PI * 2;
      w.x += Math.cos(a) * jumpR;
      w.y += Math.sin(a) * jumpR;
    } else {
      w.x += (Math.random() - 0.5) * 2;
      w.y += (Math.random() - 0.5) * 2;
    }

    const ix = Math.round(w.x);
    const iy = Math.round(w.y);

    if (ix >= 0 && ix < SZ && iy >= 0 && iy < SZ && grid[iy * SZ + ix]) {
      walkers[i] = spawnWalker();
      continue;
    }

    if (ix < 0 || ix >= SZ || iy < 0 || iy >= SZ) {
      walkers[i] = spawnWalker();
      continue;
    }

    const dx = w.x - cx;
    const dy = w.y - cy;
    if (dx * dx + dy * dy > killR2) {
      walkers[i] = spawnWalker();
      continue;
    }

    if (hasNeighbor(ix, iy) && !grid[iy * SZ + ix]) {
      if (Math.random() < params.stickiness) {
        grid[iy * SZ + ix] = 1;
        arrival[iy * SZ + ix] = nextArrival++;
        clusterSize++;
        const r = Math.sqrt(dx * dx + dy * dy);
        if (r + 5 > maxRadius) maxRadius = r + 5;
        walkers[i] = spawnWalker();
        stuck++;
      }
    }
  }

  while (walkers.length < params.walkerCount) {
    walkers.push(spawnWalker());
  }

  return stuck;
}

function render() {
  const data = imageData.data;
  const maxArr = nextArrival;

  for (let i = 0; i < SZ * SZ; i++) {
    const off = i * 4;
    if (grid[i]) {
      const t = arrival[i] / maxArr;
      if (colorMode === 0) {
        // frost: white core fading to blue tips
        const r = Math.floor(140 + 115 * (1 - t));
        const g = Math.floor(160 + 95 * (1 - t));
        const b = Math.floor(200 + 55 * (1 - t));
        data[off] = r;
        data[off + 1] = g;
        data[off + 2] = b;
      } else if (colorMode === 1) {
        // temporal: blue early, white late
        data[off] = Math.floor(80 + 175 * t);
        data[off + 1] = Math.floor(120 + 135 * t);
        data[off + 2] = Math.floor(200 + 55 * t);
      } else {
        // depth: color by distance from center
        const x = i % SZ;
        const y = (i / SZ) | 0;
        const cx = SZ >> 1;
        const cy = SZ >> 1;
        const d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
        const dt = Math.min(d / (maxRadius + 1), 1);
        data[off] = Math.floor(220 - 160 * dt);
        data[off + 1] = Math.floor(230 - 120 * dt);
        data[off + 2] = Math.floor(255 - 40 * dt);
      }
      data[off + 3] = 255;
    } else {
      data[off] = 10;
      data[off + 1] = 10;
      data[off + 2] = 15;
      data[off + 3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

function updateStats() {
  const fill = ((clusterSize / (SZ * SZ)) * 100).toFixed(2);
  statsEl.textContent = `cluster: ${clusterSize} | radius: ${Math.round(maxRadius)} | fill: ${fill}%`;
}

function frame() {
  if (!paused) {
    const stepsPerFrame = 8;
    for (let s = 0; s < stepsPerFrame; s++) {
      stepWalkers();
    }
    render();
    updateStats();
  }
  animId = requestAnimationFrame(frame);
}

// controls
document.getElementById('walkerCount').addEventListener('input', e => {
  params.walkerCount = +e.target.value;
  document.getElementById('walkerCountVal').textContent = e.target.value;
});
document.getElementById('stickiness').addEventListener('input', e => {
  params.stickiness = +e.target.value;
  document.getElementById('stickinessVal').textContent = e.target.value;
});
document.getElementById('resetBtn').addEventListener('click', () => {
  cancelAnimationFrame(animId);
  init();
  frame();
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * (SZ / rect.width));
  const y = Math.round((e.clientY - rect.top) * (SZ / rect.height));
  addSeed(x, y);
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  if (e.code === 'KeyR') {
    cancelAnimationFrame(animId);
    init();
    frame();
  }
  if (e.code === 'KeyC') {
    colorMode = (colorMode + 1) % 3;
    if (!paused) return;
    render();
  }
});

window.addEventListener('resize', () => {
  cancelAnimationFrame(animId);
  init();
  frame();
});

init();
frame();
</script>
</body>
</html>
