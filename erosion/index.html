<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydraulic Erosion</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #c8c8d0;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
canvas {
  display: block;
  cursor: crosshair;
}
.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 13px;
  background: rgba(10, 10, 15, 0.85);
  padding: 10px 18px;
  border-radius: 8px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(200, 200, 208, 0.1);
  z-index: 10;
}
.controls label {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.controls input[type="range"] {
  width: 80px;
  accent-color: #8a9eb5;
}
.controls button {
  background: rgba(138, 158, 181, 0.15);
  border: 1px solid rgba(138, 158, 181, 0.3);
  color: #c8c8d0;
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}
.controls button:hover {
  background: rgba(138, 158, 181, 0.25);
}
.info {
  position: fixed;
  top: 16px;
  left: 16px;
  font-size: 13px;
  line-height: 1.5;
  color: rgba(200, 200, 208, 0.5);
  z-index: 10;
}
.info kbd {
  background: rgba(200, 200, 208, 0.1);
  border: 1px solid rgba(200, 200, 208, 0.15);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 12px;
}
.stats {
  position: fixed;
  top: 16px;
  right: 16px;
  font-size: 13px;
  line-height: 1.5;
  color: rgba(200, 200, 208, 0.4);
  text-align: right;
  z-index: 10;
}
</style>
</head>
<body>
<div class="info">
  Click to rain. <kbd>Space</kbd> pause. <kbd>W</kbd> toggle water. <kbd>R</kbd> reset.
</div>
<div class="stats" id="stats"></div>
<canvas id="canvas"></canvas>
<div class="controls">
  <label>Rain: <input type="range" id="rainRate" min="50" max="2000" step="50" value="500"><span id="rainRateVal">500</span></label>
  <label>Erosion: <input type="range" id="erosionRate" min="0.01" max="0.15" step="0.01" value="0.05"><span id="erosionRateVal">0.05</span></label>
  <label>Inertia: <input type="range" id="inertia" min="0.0" max="0.9" step="0.05" value="0.3"><span id="inertiaVal">0.3</span></label>
  <button id="resetBtn">Reset</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');

const SZ = 512;
let height, flow, imageData;
let paused = false;
let showWater = true;
let totalDrops = 0;
let animId;

const params = {
  rainRate: 500,
  erosionRate: 0.05,
  depositionRate: 0.03,
  inertia: 0.3,
  gravity: 10,
  evaporation: 0.01,
  capacity: 8,
  minSlope: 0.01,
  dropLifetime: 80,
  brushRadius: 30,
};

// simple hash for noise
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

function smoothNoise(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;
  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy);
  const b = hash(ix + 1, iy);
  const c = hash(ix, iy + 1);
  const d = hash(ix + 1, iy + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function fbm(x, y, octaves) {
  let val = 0, amp = 1, freq = 1, total = 0;
  for (let i = 0; i < octaves; i++) {
    val += smoothNoise(x * freq, y * freq) * amp;
    total += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return val / total;
}

function generateTerrain() {
  height = new Float32Array(SZ * SZ);
  flow = new Float32Array(SZ * SZ);

  const seed = Math.random() * 1000;
  for (let y = 0; y < SZ; y++) {
    for (let x = 0; x < SZ; x++) {
      const nx = (x + seed) / SZ * 6;
      const ny = (y + seed) / SZ * 6;
      let h = fbm(nx, ny, 7);

      // ridge noise on top
      const ridge = 1 - Math.abs(fbm(nx * 1.5 + 100, ny * 1.5 + 100, 4) * 2 - 1);
      h = h * 0.7 + ridge * ridge * 0.3;

      // edge falloff to keep water on the map
      const dx = (x / SZ - 0.5) * 2;
      const dy = (y / SZ - 0.5) * 2;
      const edge = Math.max(Math.abs(dx), Math.abs(dy));
      const falloff = edge > 0.8 ? (edge - 0.8) / 0.2 : 0;
      h -= falloff * falloff * 0.5;

      height[y * SZ + x] = h;
    }
  }
}

function getGradient(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  if (ix < 1 || ix >= SZ - 1 || iy < 1 || iy >= SZ - 1) {
    return { gx: 0, gy: 0 };
  }

  const fx = x - ix;
  const fy = y - iy;

  // bilinear height
  const i00 = iy * SZ + ix;
  const h00 = height[i00];
  const h10 = height[i00 + 1];
  const h01 = height[i00 + SZ];
  const h11 = height[i00 + SZ + 1];

  const gx = (h10 - h00) * (1 - fy) + (h11 - h01) * fy;
  const gy = (h01 - h00) * (1 - fx) + (h11 - h10) * fx;

  return { gx, gy };
}

function heightAt(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  if (ix < 0 || ix >= SZ - 1 || iy < 0 || iy >= SZ - 1) return 0;
  const fx = x - ix;
  const fy = y - iy;
  const i = iy * SZ + ix;
  return height[i] * (1 - fx) * (1 - fy)
       + height[i + 1] * fx * (1 - fy)
       + height[i + SZ] * (1 - fx) * fy
       + height[i + SZ + 1] * fx * fy;
}

function erodeAt(x, y, amount) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  if (ix < 1 || ix >= SZ - 1 || iy < 1 || iy >= SZ - 1) return;
  const fx = x - ix;
  const fy = y - iy;
  const i = iy * SZ + ix;
  height[i]         -= amount * (1 - fx) * (1 - fy);
  height[i + 1]     -= amount * fx * (1 - fy);
  height[i + SZ]    -= amount * (1 - fx) * fy;
  height[i + SZ + 1] -= amount * fx * fy;
}

function depositAt(x, y, amount) {
  erodeAt(x, y, -amount);
}

function simulateDrop(startX, startY) {
  let x = startX;
  let y = startY;
  let dx = 0;
  let dy = 0;
  let speed = 0;
  let sediment = 0;
  let water = 1;

  for (let step = 0; step < params.dropLifetime; step++) {
    const grad = getGradient(x, y);
    const oldH = heightAt(x, y);

    // apply inertia
    dx = dx * params.inertia - grad.gx * (1 - params.inertia);
    dy = dy * params.inertia - grad.gy * (1 - params.inertia);

    // normalize direction
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) {
      dx /= len;
      dy /= len;
    } else {
      // random direction if flat
      const a = Math.random() * Math.PI * 2;
      dx = Math.cos(a);
      dy = Math.sin(a);
    }

    const nx = x + dx;
    const ny = y + dy;

    if (nx < 1 || nx >= SZ - 2 || ny < 1 || ny >= SZ - 2) break;

    const newH = heightAt(nx, ny);
    const dh = newH - oldH;

    // capacity based on speed and slope
    const cap = Math.max(-dh, params.minSlope) * speed * water * params.capacity;

    if (sediment > cap || dh > 0) {
      // deposit
      const dep = dh > 0
        ? Math.min(sediment, dh)
        : (sediment - cap) * params.depositionRate;
      sediment -= dep;
      depositAt(x, y, dep);
    } else {
      // erode
      const ero = Math.min((cap - sediment) * params.erosionRate, -dh);
      sediment += ero;
      erodeAt(x, y, ero);
    }

    // record flow
    const ix = Math.round(x);
    const iy = Math.round(y);
    if (ix >= 0 && ix < SZ && iy >= 0 && iy < SZ) {
      flow[iy * SZ + ix] += water;
    }

    speed = Math.sqrt(Math.max(0, speed * speed + dh * params.gravity));
    water *= (1 - params.evaporation);
    x = nx;
    y = ny;
  }
}

function rainStep() {
  const n = params.rainRate;
  for (let i = 0; i < n; i++) {
    const x = 2 + Math.random() * (SZ - 4);
    const y = 2 + Math.random() * (SZ - 4);
    simulateDrop(x, y);
  }
  totalDrops += n;

  // decay flow slightly so it stays current
  for (let i = 0; i < flow.length; i++) {
    flow[i] *= 0.995;
  }
}

function render() {
  if (!imageData) {
    imageData = ctx.createImageData(SZ, SZ);
  }
  const data = imageData.data;

  // find height range
  let hMin = Infinity, hMax = -Infinity;
  for (let i = 0; i < height.length; i++) {
    if (height[i] < hMin) hMin = height[i];
    if (height[i] > hMax) hMax = height[i];
  }
  const hRange = hMax - hMin || 1;

  // find max flow for normalization
  let fMax = 0;
  if (showWater) {
    for (let i = 0; i < flow.length; i++) {
      if (flow[i] > fMax) fMax = flow[i];
    }
  }

  for (let i = 0; i < height.length; i++) {
    const t = (height[i] - hMin) / hRange;
    const p = i * 4;

    // terrain gradient: dark earth to light sand to pale peak
    let r, g, b;
    if (t < 0.3) {
      const s = t / 0.3;
      r = 25 + s * 40;
      g = 28 + s * 35;
      b = 20 + s * 20;
    } else if (t < 0.6) {
      const s = (t - 0.3) / 0.3;
      r = 65 + s * 55;
      g = 63 + s * 50;
      b = 40 + s * 30;
    } else if (t < 0.85) {
      const s = (t - 0.6) / 0.25;
      r = 120 + s * 50;
      g = 113 + s * 50;
      b = 70 + s * 40;
    } else {
      const s = (t - 0.85) / 0.15;
      r = 170 + s * 50;
      g = 163 + s * 50;
      b = 110 + s * 50;
    }

    // hillshade
    const y = Math.floor(i / SZ);
    const x = i % SZ;
    if (x > 0 && x < SZ - 1 && y > 0 && y < SZ - 1) {
      const dzdx = (height[i + 1] - height[i - 1]) * 0.5;
      const dzdy = (height[i + SZ] - height[i - SZ]) * 0.5;
      const shade = 0.6 + 0.4 * (-dzdx + dzdy) / (Math.sqrt(dzdx * dzdx + dzdy * dzdy + 1));
      r *= shade;
      g *= shade;
      b *= shade;
    }

    // water overlay
    if (showWater && fMax > 0) {
      const f = flow[i] / fMax;
      if (f > 0.001) {
        const w = Math.pow(f, 0.3);
        const wr = 40 + w * 60;
        const wg = 80 + w * 100;
        const wb = 140 + w * 115;
        const blend = Math.min(w * 0.8, 0.85);
        r = r * (1 - blend) + wr * blend;
        g = g * (1 - blend) + wg * blend;
        b = b * (1 - blend) + wb * blend;
      }
    }

    data[p]     = Math.min(255, r) | 0;
    data[p + 1] = Math.min(255, g) | 0;
    data[p + 2] = Math.min(255, b) | 0;
    data[p + 3] = 255;
  }

  ctx.putImageData(imageData, 0, 0);
}

function resize() {
  const size = Math.min(window.innerWidth, window.innerHeight) - 20;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = SZ;
  canvas.height = SZ;
}

function loop() {
  if (!paused) {
    rainStep();
    render();
    statsEl.textContent = `${(totalDrops / 1000).toFixed(0)}k drops`;
  }
  animId = requestAnimationFrame(loop);
}

function init() {
  totalDrops = 0;
  generateTerrain();
  imageData = null;
  render();
}

// click to rain on a spot
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * SZ;
  const sy = (e.clientY - rect.top) / rect.height * SZ;
  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * params.brushRadius;
    const px = sx + Math.cos(angle) * r;
    const py = sy + Math.sin(angle) * r;
    if (px >= 2 && px < SZ - 2 && py >= 2 && py < SZ - 2) {
      simulateDrop(px, py);
    }
  }
  totalDrops += 200;
  render();
});

let dragging = false;
canvas.addEventListener('mousedown', () => { dragging = true; });
window.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * SZ;
  const sy = (e.clientY - rect.top) / rect.height * SZ;
  for (let i = 0; i < 100; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * params.brushRadius;
    const px = sx + Math.cos(angle) * r;
    const py = sy + Math.sin(angle) * r;
    if (px >= 2 && px < SZ - 2 && py >= 2 && py < SZ - 2) {
      simulateDrop(px, py);
    }
  }
  totalDrops += 100;
});

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    paused = !paused;
  } else if (e.key === 'w' || e.key === 'W') {
    showWater = !showWater;
  } else if (e.key === 'r' || e.key === 'R') {
    cancelAnimationFrame(animId);
    init();
    loop();
  }
});

// slider controls
const sliders = {
  rainRate: { key: 'rainRate', fmt: v => v },
  erosionRate: { key: 'erosionRate', fmt: v => v },
  inertia: { key: 'inertia', fmt: v => v },
};
for (const [id, cfg] of Object.entries(sliders)) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + 'Val');
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    params[cfg.key] = v;
    valEl.textContent = cfg.fmt(v);
  });
}
document.getElementById('resetBtn').addEventListener('click', () => {
  cancelAnimationFrame(animId);
  init();
  loop();
});

window.addEventListener('resize', resize);

resize();
init();
loop();
</script>
</body>
</html>
