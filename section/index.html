<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111114;
  color: #b0a898;
  font-family: Georgia, 'Times New Roman', serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3rem 1rem 4rem;
  min-height: 100vh;
}
h1 {
  font-size: 1.2rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: #c8c0b8;
  margin-bottom: 1.6rem;
}
canvas {
  display: block;
  cursor: crosshair;
}
.hint {
  font-size: 0.72rem;
  color: #3a3a3a;
  margin-top: 0.7rem;
  letter-spacing: 0.05em;
  transition: opacity 0.8s ease;
}
#reading {
  max-width: 420px;
  margin-top: 2rem;
  line-height: 1.9;
  font-size: 0.85rem;
}
#reading p {
  margin-bottom: 0.4rem;
  opacity: 0;
  animation: appear 0.7s ease forwards;
}
@keyframes appear {
  to { opacity: 1; }
}
#count {
  margin-top: 1.5rem;
  font-size: 0.7rem;
  color: #333;
  letter-spacing: 0.08em;
}
</style>
</head>
<body>

<h1>section</h1>
<canvas id="c" width="600" height="600"></canvas>
<p class="hint" id="hint">click to cut</p>
<div id="reading"></div>
<div id="count"></div>

<script>
(() => {
  function mulberry32(seed) {
    return () => {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(185);

  const W = 600, H = 600;
  const CX = W / 2, CY = H / 2;
  const RINGS = 185;
  const PITH_R = 3;
  const PDX = 5, PDY = -3;
  const BARK_R = 260;
  const BARK_C = '#5e544a';
  const BG = '#111114';
  const REVEAL = 9;
  const KERF = 1.5;
  const dpr = window.devicePixelRatio || 1;

  const cuts = [];
  let hoverAng = null;
  let over = false;
  let shown = 0;

  function lerp(a, b, t) {
    return a + (b - a) * Math.max(0, Math.min(1, t));
  }

  function rgb(r, g, b) {
    return 'rgb(' + [r, g, b].map(v =>
      Math.round(Math.max(0, Math.min(255, v)))
    ).join(',') + ')';
  }

  // --- Generate ring structure ---

  function makeRings() {
    const rings = [];
    const ws = [];

    for (let i = 0; i < RINGS; i++) {
      const yr = i + 1;
      const r = { year: yr, wound: false, drought: false, phase: '' };
      let w;

      if (yr <= 23) {
        r.phase = 'wild';
        w = 1.4 + rand() * 1.1;
      } else if (yr <= 123) {
        r.phase = 'pollard';
        const cyc = (yr - 24) % 8;
        r.wound = cyc === 0;
        w = r.wound ? 0.35 + rand() * 0.25
          : cyc <= 2 ? 0.7 + rand() * 0.35
          : 0.85 + rand() * 0.45;
      } else {
        r.phase = 'free';
        const since = yr - 123;
        r.drought = yr === 148 || yr === 165;
        w = r.drought ? 0.2 + rand() * 0.15
          : since <= 6 ? 2.2 + rand() * 1.2
          : 1.5 + rand() * 0.9;
      }

      ws.push(w);
      rings.push(r);
    }

    const target = BARK_R + Math.hypot(PDX, PDY) + 6;
    const scale = (target - PITH_R) / ws.reduce((a, b) => a + b, 0);
    let rad = PITH_R;

    for (let i = 0; i < RINGS; i++) {
      rings[i].inner = rad;
      rings[i].w = ws[i] * scale;
      rad += rings[i].w;
      rings[i].outer = rad;
      rings[i].mid = (rings[i].inner + rings[i].outer) / 2;

      const t = (i + 1) / RINGS;
      const v = (rand() - 0.5) * 10;

      if (rings[i].wound) {
        rings[i].ec = '#4a3222';
        rings[i].lc = '#382414';
      } else if (rings[i].drought) {
        rings[i].ec = rgb(
          lerp(78, 185, t * 0.8) + 14,
          lerp(52, 155, t * 0.7) + 10,
          lerp(35, 115, t * 0.6) + 7
        );
        rings[i].lc = rgb(
          lerp(78, 185, t * 0.8) + 4,
          lerp(52, 155, t * 0.7),
          lerp(35, 115, t * 0.6) - 2
        );
      } else {
        rings[i].ec = rgb(
          lerp(78, 185, t * 0.8) + 10 + v,
          lerp(52, 155, t * 0.7) + 7 + v,
          lerp(35, 115, t * 0.6) + 4 + v
        );
        rings[i].lc = rgb(
          lerp(78, 185, t * 0.8) - 10 + v,
          lerp(52, 155, t * 0.7) - 8 + v,
          lerp(35, 115, t * 0.6) - 5 + v
        );
      }
    }

    return rings;
  }

  const rings = makeRings();

  // --- Canvas setup ---

  function makeOff(w, h) {
    const c = document.createElement('canvas');
    c.width = w * dpr;
    c.height = h * dpr;
    const x = c.getContext('2d');
    x.scale(dpr, dpr);
    return { c, x };
  }

  const el = document.getElementById('c');
  el.width = W * dpr;
  el.height = H * dpr;
  el.style.width = W + 'px';
  el.style.height = H + 'px';
  const ctx = el.getContext('2d');
  ctx.scale(dpr, dpr);

  const rl = makeOff(W, H);
  const bl = makeOff(W, H);

  // --- Draw ring structure (once) ---

  (function drawAllRings() {
    const x = rl.x;
    x.fillStyle = BG;
    x.fillRect(0, 0, W, H);

    x.save();
    x.beginPath();
    x.arc(CX, CY, BARK_R, 0, Math.PI * 2);
    x.clip();

    const ox = CX + PDX, oy = CY + PDY;
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      x.beginPath();
      x.arc(ox, oy, r.outer, 0, Math.PI * 2);
      x.fillStyle = r.lc;
      x.fill();
      x.beginPath();
      x.arc(ox, oy, r.mid, 0, Math.PI * 2);
      x.fillStyle = r.ec;
      x.fill();
    }

    x.beginPath();
    x.arc(ox, oy, PITH_R, 0, Math.PI * 2);
    x.fillStyle = '#3a2a1a';
    x.fill();

    x.restore();
  })();

  // --- Draw bark (once) ---

  (function drawBark() {
    const x = bl.x;
    x.clearRect(0, 0, W, H);

    x.beginPath();
    x.arc(CX, CY, BARK_R, 0, Math.PI * 2);
    x.fillStyle = BARK_C;
    x.fill();

    x.strokeStyle = 'rgba(0,0,0,0.12)';
    x.lineWidth = 0.5;
    for (let i = 0; i < 50; i++) {
      const a = rand() * Math.PI * 2;
      const r1 = BARK_R - rand() * 18;
      x.beginPath();
      x.moveTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
      x.lineTo(CX + Math.cos(a) * BARK_R, CY + Math.sin(a) * BARK_R);
      x.stroke();
    }
  })();

  // --- Cut mechanics ---

  function punchCut(angle) {
    const ext = BARK_R + 5;

    bl.x.save();
    bl.x.globalCompositeOperation = 'destination-out';
    bl.x.fillStyle = '#fff';
    bl.x.translate(CX, CY);
    bl.x.rotate(angle);
    bl.x.fillRect(-REVEAL / 2, -ext, REVEAL, ext * 2);
    bl.x.restore();

    rl.x.save();
    rl.x.globalCompositeOperation = 'destination-out';
    rl.x.fillStyle = '#fff';
    rl.x.translate(CX, CY);
    rl.x.rotate(angle);
    rl.x.fillRect(-KERF / 2, -ext, KERF, ext * 2);
    rl.x.restore();
  }

  // --- Render ---

  function render() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(rl.c, 0, 0, W, H);
    ctx.drawImage(bl.c, 0, 0, W, H);

    if (over && hoverAng !== null) {
      ctx.save();
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = '#fff';
      ctx.translate(CX, CY);
      ctx.rotate(hoverAng);
      ctx.fillRect(-REVEAL / 2, -(BARK_R + 5), REVEAL, (BARK_R + 5) * 2);
      ctx.restore();
    }
  }

  // --- Observations ---

  const OBS = [
    [1,  '185 rings. Three distinct growth phases.'],
    [2,  'Growth asymmetric. Wider to the south-southwest.'],
    [3,  'Middle third: cyclical. Narrow ring every eight years, dense wound-wood at each. Pollarding.'],
    [4,  '23 rings before the first cut. Irregular widths. Wild growth.'],
    [5,  'Outer 62: wide and steady. No wound-wood. Pollarding stopped.'],
    [7,  'Two drought years in the free-growth period.'],
    [9,  'Ring 23, ring 24. Wild one year. Managed the next.'],
    [11, 'Four wide rings after the last pollard cut. Release growth.'],
    [14, 'Pith off-center. It leaned from its first year.'],
    [17, '23 years wild. A century pollarded. 62 years free. Removed for a house.'],
    [28, 'Nothing new.'],
  ];

  const readEl = document.getElementById('reading');
  const countEl = document.getElementById('count');
  const hintEl = document.getElementById('hint');

  function updateReading() {
    while (shown < OBS.length && cuts.length >= OBS[shown][0]) {
      const p = document.createElement('p');
      p.textContent = OBS[shown][1];
      readEl.appendChild(p);
      shown++;
    }
    countEl.textContent = cuts.length > 0
      ? cuts.length + ' cut' + (cuts.length === 1 ? '' : 's')
      : '';
    if (cuts.length >= 1) hintEl.style.opacity = '0';
  }

  // --- Events ---

  function getAngle(e) {
    const r = el.getBoundingClientRect();
    return Math.atan2(
      e.clientY - r.top - CY * (r.height / H),
      e.clientX - r.left - CX * (r.width / W)
    );
  }

  function isInside(e) {
    const r = el.getBoundingClientRect();
    const sx = r.width / W, sy = r.height / H;
    const dx = e.clientX - r.left - CX * sx;
    const dy = e.clientY - r.top - CY * sy;
    return (dx * dx + dy * dy) <= (BARK_R * sx) * (BARK_R * sy);
  }

  el.addEventListener('click', e => {
    if (!isInside(e)) return;
    const a = getAngle(e);
    cuts.push(a);
    punchCut(a);
    updateReading();
    render();
  });

  el.addEventListener('mousemove', e => {
    over = isInside(e);
    hoverAng = getAngle(e);
    render();
  });

  el.addEventListener('mouseleave', () => {
    over = false;
    render();
  });

  render();
})();
</script>

</body>
</html>
