<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wave Interference</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #1a1a1e;
  color: #d4d0c8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
  min-height: 100vh;
  user-select: none;
}
h1 {
  font-size: 1.3rem;
  font-weight: 400;
  letter-spacing: 0.03em;
  margin-bottom: 0.3rem;
  color: #e8e4dc;
}
.note {
  font-size: 0.8rem;
  color: #777;
  margin-bottom: 1.5rem;
  max-width: 640px;
  text-align: center;
  line-height: 1.5;
}
.canvas-wrap {
  position: relative;
  margin-bottom: 1.2rem;
}
canvas {
  border: 1px solid #333;
  background: #0d0d10;
  display: block;
  cursor: crosshair;
}
#hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.85rem;
  color: #555;
  pointer-events: none;
  transition: opacity 0.3s;
}
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.7rem;
  margin-bottom: 1rem;
  width: 100%;
  max-width: 640px;
}
.row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  width: 100%;
}
.row label {
  font-size: 0.78rem;
  color: #888;
  min-width: 72px;
  text-align: right;
}
.row input[type="range"] {
  flex: 1;
  accent-color: #7090b0;
  height: 4px;
}
.row .value {
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  color: #aaa;
  min-width: 32px;
}
.btn-row {
  display: flex;
  gap: 0.4rem;
  justify-content: center;
  margin-top: 0.2rem;
}
button {
  font-family: inherit;
  font-size: 0.73rem;
  padding: 0.35rem 0.85rem;
  border: 1px solid #444;
  background: #252528;
  color: #d4d0c8;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
button:hover { background: #333; border-color: #666; }
button.active {
  background: #7090b0;
  color: #1a1a1e;
  border-color: #7090b0;
}
#source-panel {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.source-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.source-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.source-row .slabel {
  font-size: 0.75rem;
  color: #888;
  min-width: 14px;
}
.source-row .plabel {
  font-size: 0.72rem;
  color: #555;
}
.source-row input[type="range"] {
  flex: 1;
  height: 3px;
}
.source-row .pval {
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: #aaa;
  min-width: 34px;
  text-align: right;
}
.source-row .rm {
  background: none;
  border: none;
  color: #555;
  font-size: 1rem;
  cursor: pointer;
  padding: 0 0.2rem;
  line-height: 1;
}
.source-row .rm:hover { color: #c44; }
</style>
</head>
<body>

<h1>Wave Interference</h1>
<p class="note">
  Point sources emit circular waves at the same frequency.
  Where wavefronts overlap they interfere -- reinforcing or canceling
  depending on the path difference. Click to place sources, drag to move them.
</p>

<div class="canvas-wrap">
  <canvas id="cv" width="500" height="500"></canvas>
  <div id="hint">click to add a source</div>
</div>

<div class="controls">
  <div class="row">
    <label>wavelength</label>
    <input type="range" id="wl" min="10" max="120" value="40">
    <span class="value" id="wl-v">40</span>
  </div>
  <div class="row">
    <label>speed</label>
    <input type="range" id="spd" min="0" max="100" value="40">
    <span class="value" id="spd-v">40</span>
  </div>
  <div class="btn-row">
    <button id="mode-btn">field</button>
    <button id="pause-btn">pause</button>
    <button id="clear-btn">clear</button>
  </div>
</div>

<div id="source-panel"></div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const hint = document.getElementById('hint');
const panel = document.getElementById('source-panel');

const SCALE = 2;
const GW = W / SCALE | 0;
const GH = H / SCALE | 0;
const off = document.createElement('canvas');
off.width = GW;
off.height = GH;
const offCtx = off.getContext('2d');
const imgData = offCtx.createImageData(GW, GH);
const pix = imgData.data;

const COLORS = ['#e8524a', '#4a9de8', '#5ce84a', '#e8c84a', '#c84ae8', '#4ae8c8'];

// --- Colormaps ---

function buildLUT(stops, size, remap) {
  const lut = new Uint8Array(size * 3);
  for (let i = 0; i < size; i++) {
    const t = remap(i / (size - 1));
    let r = 13, g = 13, b = 16;
    for (let s = 1; s < stops.length; s++) {
      if (t <= stops[s][0] || s === stops.length - 1) {
        const prev = stops[Math.max(0, s - 1)];
        const curr = stops[s];
        const f = curr[0] === prev[0] ? 1 : (t - prev[0]) / (curr[0] - prev[0]);
        const c = Math.max(0, Math.min(1, f));
        r = prev[1] + c * (curr[1] - prev[1]);
        g = prev[2] + c * (curr[2] - prev[2]);
        b = prev[3] + c * (curr[3] - prev[3]);
        break;
      }
    }
    lut[i * 3] = r;
    lut[i * 3 + 1] = g;
    lut[i * 3 + 2] = b;
  }
  return lut;
}

const fieldLUT = buildLUT(
  [[-1, 26, 80, 176], [-0.35, 13, 28, 65], [0, 13, 13, 16], [0.35, 65, 25, 13], [1, 200, 90, 30]],
  512, t => t * 2 - 1
);

const intensityLUT = buildLUT(
  [[0, 13, 13, 16], [0.2, 35, 14, 90], [0.45, 130, 25, 55], [0.7, 210, 120, 30], [1, 255, 235, 170]],
  256, t => t
);

// --- State ---

let sources = [];
let wavelength = 40;
let speed = 40;
let time = 0;
let mode = 'field';
let paused = false;
let dragging = -1;

// --- Compute ---

function compute() {
  const n = sources.length;
  if (n === 0) {
    for (let i = 0; i < pix.length; i += 4) {
      pix[i] = 13; pix[i + 1] = 13; pix[i + 2] = 16; pix[i + 3] = 255;
    }
    return;
  }

  const k = 2 * Math.PI / wavelength;
  const sx = new Float64Array(n);
  const sy = new Float64Array(n);
  const sp = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    sx[i] = sources[i].x;
    sy[i] = sources[i].y;
    sp[i] = sources[i].phase;
  }

  if (mode === 'field') {
    const wt = speed * 0.01 * time;
    const inv = 1 / n;
    for (let gy = 0; gy < GH; gy++) {
      const y = (gy + 0.5) * SCALE;
      for (let gx = 0; gx < GW; gx++) {
        const x = (gx + 0.5) * SCALE;
        let val = 0;
        for (let i = 0; i < n; i++) {
          const dx = x - sx[i], dy = y - sy[i];
          val += Math.sin(k * Math.sqrt(dx * dx + dy * dy) - wt + sp[i]);
        }
        const t = val * inv;
        const li = Math.max(0, Math.min(511, ((t + 1) * 255.5) | 0));
        const pi = (gy * GW + gx) * 4;
        pix[pi] = fieldLUT[li * 3];
        pix[pi + 1] = fieldLUT[li * 3 + 1];
        pix[pi + 2] = fieldLUT[li * 3 + 2];
        pix[pi + 3] = 255;
      }
    }
  } else {
    const inv2 = 1 / (n * n);
    for (let gy = 0; gy < GH; gy++) {
      const y = (gy + 0.5) * SCALE;
      for (let gx = 0; gx < GW; gx++) {
        const x = (gx + 0.5) * SCALE;
        let re = 0, im = 0;
        for (let i = 0; i < n; i++) {
          const dx = x - sx[i], dy = y - sy[i];
          const a = k * Math.sqrt(dx * dx + dy * dy) + sp[i];
          re += Math.cos(a);
          im += Math.sin(a);
        }
        const intensity = (re * re + im * im) * inv2;
        const li = Math.max(0, Math.min(255, (intensity * 255) | 0));
        const pi = (gy * GW + gx) * 4;
        pix[pi] = intensityLUT[li * 3];
        pix[pi + 1] = intensityLUT[li * 3 + 1];
        pix[pi + 2] = intensityLUT[li * 3 + 2];
        pix[pi + 3] = 255;
      }
    }
  }
}

function drawSources() {
  for (let i = 0; i < sources.length; i++) {
    const s = sources[i];
    ctx.beginPath();
    ctx.arc(s.x, s.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i];
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), s.x, s.y + 0.5);
  }
}

function frame() {
  if (!paused && mode === 'field') time++;
  compute();
  offCtx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, W, H);
  drawSources();
  requestAnimationFrame(frame);
}

// --- Source management ---

function addSource(x, y, phase) {
  if (sources.length >= 6) return;
  sources.push({ x: x, y: y, phase: phase || 0 });
  hint.style.opacity = '0';
  buildPanel();
}

function removeSource(idx) {
  sources.splice(idx, 1);
  if (!sources.length) hint.style.opacity = '1';
  buildPanel();
}

function buildPanel() {
  panel.innerHTML = '';
  sources.forEach(function(s, i) {
    const row = document.createElement('div');
    row.className = 'source-row';

    const dot = document.createElement('span');
    dot.className = 'source-dot';
    dot.style.background = COLORS[i];

    const lbl = document.createElement('span');
    lbl.className = 'slabel';
    lbl.textContent = i + 1;

    const pl = document.createElement('span');
    pl.className = 'plabel';
    pl.textContent = 'phase';

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '0';
    slider.max = '628';
    slider.value = String(Math.round(s.phase * 100));
    slider.style.accentColor = COLORS[i];

    const val = document.createElement('span');
    val.className = 'pval';
    val.textContent = fmtPhase(s.phase);

    slider.oninput = function() {
      s.phase = parseInt(slider.value) / 100;
      val.textContent = fmtPhase(s.phase);
    };

    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.onclick = function() { removeSource(i); };

    row.append(dot, lbl, pl, slider, val, rm);
    panel.appendChild(row);
  });
}

function fmtPhase(p) {
  return (p / Math.PI).toFixed(1) + 'π';
}

// --- Canvas interaction ---

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}

function hitSource(x, y) {
  for (let i = sources.length - 1; i >= 0; i--) {
    const dx = x - sources[i].x, dy = y - sources[i].y;
    if (dx * dx + dy * dy < 324) return i;
  }
  return -1;
}

let downAt = null;
let moved = false;

canvas.addEventListener('pointerdown', function(e) {
  const p = pos(e);
  downAt = p;
  moved = false;
  const hit = hitSource(p[0], p[1]);
  if (hit >= 0) {
    dragging = hit;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
  }
  e.preventDefault();
});

canvas.addEventListener('pointermove', function(e) {
  const p = pos(e);
  if (dragging >= 0) {
    sources[dragging].x = p[0];
    sources[dragging].y = p[1];
    moved = true;
  } else if (downAt) {
    const dx = p[0] - downAt[0], dy = p[1] - downAt[1];
    if (dx * dx + dy * dy > 16) moved = true;
  } else {
    canvas.style.cursor = hitSource(p[0], p[1]) >= 0 ? 'grab' : 'crosshair';
  }
});

canvas.addEventListener('pointerup', function(e) {
  if (dragging >= 0) {
    canvas.releasePointerCapture(e.pointerId);
    dragging = -1;
    canvas.style.cursor = 'crosshair';
    downAt = null;
    return;
  }
  if (!moved && downAt) {
    if (hitSource(downAt[0], downAt[1]) < 0 && sources.length < 6) {
      addSource(downAt[0], downAt[1], 0);
    }
  }
  downAt = null;
  moved = false;
});

// --- Controls ---

const wlEl = document.getElementById('wl');
const wlV = document.getElementById('wl-v');
const spdEl = document.getElementById('spd');
const spdV = document.getElementById('spd-v');
const modeBtn = document.getElementById('mode-btn');
const pauseBtn = document.getElementById('pause-btn');
const clearBtn = document.getElementById('clear-btn');

wlEl.oninput = function() { wavelength = +wlEl.value; wlV.textContent = wavelength; };
spdEl.oninput = function() { speed = +spdEl.value; spdV.textContent = speed; };

modeBtn.onclick = function() {
  mode = mode === 'field' ? 'intensity' : 'field';
  modeBtn.textContent = mode;
  modeBtn.classList.toggle('active', mode === 'intensity');
};

pauseBtn.onclick = function() {
  paused = !paused;
  pauseBtn.textContent = paused ? 'play' : 'pause';
  pauseBtn.classList.toggle('active', paused);
};

clearBtn.onclick = function() {
  sources.length = 0;
  hint.style.opacity = '1';
  buildPanel();
};

// --- Init ---

addSource(200, 250, 0);
addSource(300, 250, 0);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
