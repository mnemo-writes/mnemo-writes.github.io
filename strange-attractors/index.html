<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strange Attractors</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #1a1a1e;
  color: #d4d0c8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
  min-height: 100vh;
}
h1 {
  font-size: 1.3rem;
  font-weight: 400;
  letter-spacing: 0.03em;
  margin-bottom: 0.3rem;
  color: #e8e4dc;
}
.note {
  font-size: 0.8rem;
  color: #777;
  margin-bottom: 1.5rem;
  max-width: 600px;
  text-align: center;
  line-height: 1.5;
}
canvas {
  border: 1px solid #333;
  background: #0d0d10;
  margin-bottom: 1.2rem;
  cursor: grab;
}
canvas:active { cursor: grabbing; }
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.7rem;
  margin-bottom: 1.2rem;
  width: 100%;
  max-width: 600px;
}
.row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  width: 100%;
}
.row label {
  font-size: 0.78rem;
  color: #888;
  min-width: 56px;
  text-align: right;
}
.row input[type="range"] {
  flex: 1;
  accent-color: #b08050;
  height: 4px;
}
.row .value {
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  color: #d4d0c8;
  min-width: 52px;
}
.button-row {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  font-family: inherit;
  font-size: 0.73rem;
  padding: 0.35rem 0.85rem;
  border: 1px solid #444;
  background: #252528;
  color: #d4d0c8;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
button:hover { background: #333; border-color: #666; }
button.active {
  background: #b08050;
  color: #1a1a1e;
  border-color: #b08050;
}
.param-group {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
}
.param-group .row { width: auto; flex: 1; min-width: 180px; }
.info {
  font-size: 0.72rem;
  color: #666;
  text-align: center;
  line-height: 1.6;
  max-width: 600px;
}
.separator {
  width: 100%;
  height: 1px;
  background: #2a2a2e;
  margin: 0.3rem 0;
}
</style>
</head>
<body>

<h1>Strange Attractors</h1>
<p class="note">
  Deterministic systems with chaotic orbits. The trajectory never repeats
  but is drawn to a recognizable shape. Drag to rotate, scroll to zoom.
</p>

<canvas id="cv" width="700" height="700"></canvas>

<div class="controls">
  <div class="button-row" id="presets"></div>
  <div class="separator"></div>
  <div class="param-group" id="params"></div>
  <div class="separator"></div>
  <div class="row">
    <label>speed</label>
    <input type="range" id="speed" min="1" max="200" value="60">
    <span class="value" id="speed-val">60</span>
  </div>
  <div class="row">
    <label>trail</label>
    <input type="range" id="trail" min="500" max="80000" value="20000" step="500">
    <span class="value" id="trail-val">20k</span>
  </div>
  <div class="row">
    <label>fade</label>
    <input type="range" id="fade" min="0" max="100" value="40">
    <span class="value" id="fade-val">40%</span>
  </div>
  <div class="button-row">
    <button id="btn-play">pause</button>
    <button id="btn-reset">reset</button>
    <button id="btn-spin">spin: on</button>
    <button id="btn-color" data-idx="0">color: velocity</button>
  </div>
</div>

<p class="info" id="info"></p>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const cx = W / 2, cy = H / 2;

const ATTRACTORS = {
  lorenz: {
    name: 'Lorenz',
    params: { sigma: 10, rho: 28, beta: 2.667 },
    ranges: { sigma: [0, 30, 0.1], rho: [0, 50, 0.1], beta: [0, 8, 0.001] },
    dt: 0.005,
    init: [0.1, 0, 0],
    scale: 9,
    deriv(x, y, z, p) {
      return [p.sigma * (y - x), x * (p.rho - z) - y, x * y - p.beta * z];
    },
    info: 'Lorenz (1963). Convection currents in the atmosphere. The original strange attractor, discovered while modeling weather.'
  },
  rossler: {
    name: 'Rossler',
    params: { a: 0.2, b: 0.2, c: 5.7 },
    ranges: { a: [0, 1, 0.001], b: [0, 1, 0.001], c: [0, 20, 0.01] },
    dt: 0.008,
    init: [1, 1, 0],
    scale: 14,
    deriv(x, y, z, p) {
      return [-(y + z), x + p.a * y, p.b + z * (x - p.c)];
    },
    info: 'Rossler (1976). Designed to be the simplest continuous chaotic system. One scroll instead of two.'
  },
  thomas: {
    name: 'Thomas',
    params: { b: 0.208186 },
    ranges: { b: [0, 0.5, 0.000001] },
    dt: 0.04,
    init: [1.1, 1.1, -0.01],
    scale: 55,
    deriv(x, y, z, p) {
      return [
        Math.sin(y) - p.b * x,
        Math.sin(z) - p.b * y,
        Math.sin(x) - p.b * z
      ];
    },
    info: 'Thomas (1999). A cyclically symmetric system. At b = 0.208186 it produces a labyrinthine orbit with threefold symmetry.'
  },
  aizawa: {
    name: 'Aizawa',
    params: { a: 0.95, b: 0.7, c: 0.6, d: 3.5, e: 0.25, f: 0.1 },
    ranges: { a: [0, 2, 0.01], b: [0, 2, 0.01], c: [0, 2, 0.01], d: [0, 5, 0.01], e: [0, 1, 0.01], f: [0, 1, 0.01] },
    dt: 0.005,
    init: [0.1, 0, 0],
    scale: 120,
    deriv(x, y, z, p) {
      return [
        (z - p.b) * x - p.d * y,
        p.d * x + (z - p.b) * y,
        p.c + p.a * z - (z * z * z) / 3 - (x * x + y * y) * (1 + p.e * z) + p.f * z * x * x * x
      ];
    },
    info: 'Aizawa (1982). Produces a shape like a sphere pulling apart at one pole. Transitions between toroidal and chaotic regimes.'
  },
  halvorsen: {
    name: 'Halvorsen',
    params: { a: 1.89 },
    ranges: { a: [1, 3, 0.001] },
    dt: 0.003,
    init: [-1.48, -1.51, 2.04],
    scale: 16,
    deriv(x, y, z, p) {
      return [
        -p.a * x - 4 * y - 4 * z - y * y,
        -p.a * y - 4 * z - 4 * x - z * z,
        -p.a * z - 4 * x - 4 * y - x * x
      ];
    },
    info: 'Halvorsen. A cyclically symmetric system that produces a triangular orbit with three lobes spiraling around each other.'
  },
  chen: {
    name: 'Chen',
    params: { a: 40, b: 3, c: 28 },
    ranges: { a: [20, 60, 0.1], b: [1, 10, 0.01], c: [15, 40, 0.1] },
    dt: 0.002,
    init: [-0.1, 0.5, -0.6],
    scale: 7,
    deriv(x, y, z, p) {
      return [
        p.a * (y - x),
        (p.c - p.a) * x - x * z + p.c * y,
        x * y - p.b * z
      ];
    },
    info: 'Chen (1999). Related to the Lorenz system but with a different topology. The two scrolls connect differently.'
  },
  dadras: {
    name: 'Dadras',
    params: { p: 3, o: 2.7, r: 1.7, c: 2, e: 9 },
    ranges: { p: [0, 8, 0.01], o: [0, 8, 0.01], r: [0, 8, 0.01], c: [0, 8, 0.01], e: [0, 15, 0.01] },
    dt: 0.004,
    init: [1, 0, 0],
    scale: 14,
    deriv(x, y, z, pr) {
      return [
        y - pr.p * x + pr.o * y * z,
        pr.r * y - x * z + z,
        pr.c * x * y - pr.e * z
      ];
    },
    info: 'Dadras-Momeni (2010). A four-wing attractor where the orbit visits all four quadrants. Recent compared to the classical systems.'
  }
};

const COLOR_MODES = ['velocity', 'position', 'age', 'mono'];

let current = 'lorenz';
let params = {};
let state = [0, 0, 0];
let trail = [];
let maxTrail = 20000;
let playing = true;
let spinning = true;
let stepsPerFrame = 60;
let fadeAmount = 0.4;
let colorIdx = 0;

let rotX = -0.5;
let rotY = 0.4;
let zoom = 1;
let dragging = false;
let lastMouse = [0, 0];

function loadAttractor(key) {
  const a = ATTRACTORS[key];
  current = key;
  params = { ...a.params };
  state = [...a.init];
  trail = [];
  buildParamControls();
  updatePresetButtons();
  document.getElementById('info').textContent = a.info;
}

function buildParamControls() {
  const a = ATTRACTORS[current];
  const container = document.getElementById('params');
  container.innerHTML = '';
  for (const [name, [min, max, step]] of Object.entries(a.ranges)) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.textContent = name;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = min;
    input.max = max;
    input.step = step;
    input.value = params[name];
    const val = document.createElement('span');
    val.className = 'value';
    val.textContent = fmtParam(params[name]);
    input.addEventListener('input', () => {
      params[name] = parseFloat(input.value);
      val.textContent = fmtParam(params[name]);
    });
    row.append(label, input, val);
    container.appendChild(row);
  }
}

function fmtParam(v) {
  if (Math.abs(v) >= 10) return v.toFixed(2);
  if (Math.abs(v) >= 1) return v.toFixed(3);
  return v.toFixed(4);
}

function updatePresetButtons() {
  document.querySelectorAll('#presets button').forEach(b => {
    b.classList.toggle('active', b.dataset.key === current);
  });
}

function buildPresetButtons() {
  const container = document.getElementById('presets');
  for (const [key, a] of Object.entries(ATTRACTORS)) {
    const btn = document.createElement('button');
    btn.textContent = a.name;
    btn.dataset.key = key;
    btn.addEventListener('click', () => loadAttractor(key));
    container.appendChild(btn);
  }
}

function rk4(state, dt, deriv, params) {
  const [x, y, z] = state;
  const k1 = deriv(x, y, z, params);
  const k2 = deriv(x + k1[0] * dt / 2, y + k1[1] * dt / 2, z + k1[2] * dt / 2, params);
  const k3 = deriv(x + k2[0] * dt / 2, y + k2[1] * dt / 2, z + k2[2] * dt / 2, params);
  const k4 = deriv(x + k3[0] * dt, y + k3[1] * dt, z + k3[2] * dt, params);
  return [
    x + (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) * dt / 6,
    y + (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) * dt / 6,
    z + (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]) * dt / 6
  ];
}

function project(x, y, z) {
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let rx = x;
  let ry = y * cosX - z * sinX;
  let rz = y * sinX + z * cosX;
  let fx = rx * cosY + rz * sinY;
  let fz = -rx * sinY + rz * cosY;
  const a = ATTRACTORS[current];
  const s = a.scale * zoom;
  const perspective = 800;
  const d = perspective / (perspective + fz * s * 0.3);
  return [cx + fx * s * d, cy + ry * s * d, d];
}

function velocityColor(dx, dy, dz, alpha) {
  const speed = Math.sqrt(dx * dx + dy * dy + dz * dz);
  const a = ATTRACTORS[current];
  let norm;
  if (current === 'lorenz') norm = speed / 40;
  else if (current === 'chen') norm = speed / 80;
  else if (current === 'thomas') norm = speed / 2;
  else if (current === 'halvorsen') norm = speed / 30;
  else norm = speed / 20;
  norm = Math.min(1, norm);
  const h = 30 + norm * 25;
  const s = 60 + norm * 30;
  const l = 30 + norm * 40;
  return `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
}

function positionColor(x, y, z, alpha) {
  const a = ATTRACTORS[current];
  const s = a.scale;
  const h = ((Math.atan2(y, x) / Math.PI + 1) * 180) % 360;
  const sat = 50 + Math.min(50, Math.abs(z) * s * 0.3);
  const l = 35 + Math.min(35, (Math.sqrt(x * x + y * y) / 5) * 10);
  return `hsla(${h}, ${sat}%, ${l}%, ${alpha})`;
}

function ageColor(t, total, alpha) {
  const norm = t / total;
  const h = 200 - norm * 170;
  const l = 25 + norm * 45;
  return `hsla(${h}, 70%, ${l}%, ${alpha})`;
}

function monoColor(alpha) {
  return `hsla(35, 60%, 65%, ${alpha})`;
}

function getColor(i, pt, total) {
  const alpha = fadeAmount < 0.01 ? 0.8 : (0.05 + 0.85 * Math.pow(i / total, 1 + fadeAmount * 3));
  const mode = COLOR_MODES[colorIdx];
  if (mode === 'velocity') {
    return velocityColor(pt[3], pt[4], pt[5], alpha);
  } else if (mode === 'position') {
    return positionColor(pt[0], pt[1], pt[2], alpha);
  } else if (mode === 'age') {
    return ageColor(i, total, alpha);
  } else {
    return monoColor(alpha);
  }
}

function step() {
  const a = ATTRACTORS[current];
  for (let i = 0; i < stepsPerFrame; i++) {
    const prev = [...state];
    state = rk4(state, a.dt, a.deriv, params);
    if (!isFinite(state[0]) || !isFinite(state[1]) || !isFinite(state[2])) {
      state = [...a.init];
      trail = [];
      return;
    }
    const dx = (state[0] - prev[0]) / a.dt;
    const dy = (state[1] - prev[1]) / a.dt;
    const dz = (state[2] - prev[2]) / a.dt;
    trail.push([state[0], state[1], state[2], dx, dy, dz]);
  }
  while (trail.length > maxTrail) trail.shift();
}

function draw() {
  ctx.fillStyle = '#0d0d10';
  ctx.fillRect(0, 0, W, H);

  if (trail.length < 2) return;

  const projected = trail.map(pt => {
    const [px, py, d] = project(pt[0], pt[1], pt[2]);
    return [px, py, d, pt];
  });

  const len = projected.length;
  for (let i = 1; i < len; i++) {
    const [x0, y0, d0] = projected[i - 1];
    const [x1, y1, d1, pt] = projected[i];

    if (Math.abs(x1 - x0) > 300 || Math.abs(y1 - y0) > 300) continue;

    const color = getColor(i, pt, len);
    const width = Math.max(0.5, 1.5 * ((d0 + d1) / 2));

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
}

function frame() {
  if (playing) {
    step();
    if (spinning) rotY += 0.002;
  }
  draw();
  requestAnimationFrame(frame);
}

// Controls
document.getElementById('speed').addEventListener('input', e => {
  stepsPerFrame = parseInt(e.target.value);
  document.getElementById('speed-val').textContent = stepsPerFrame;
});

document.getElementById('trail').addEventListener('input', e => {
  maxTrail = parseInt(e.target.value);
  const v = maxTrail >= 1000 ? (maxTrail / 1000) + 'k' : maxTrail;
  document.getElementById('trail-val').textContent = v;
});

document.getElementById('fade').addEventListener('input', e => {
  fadeAmount = parseInt(e.target.value) / 100;
  document.getElementById('fade-val').textContent = parseInt(e.target.value) + '%';
});

document.getElementById('btn-play').addEventListener('click', e => {
  playing = !playing;
  e.target.textContent = playing ? 'pause' : 'play';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  const a = ATTRACTORS[current];
  state = [...a.init];
  trail = [];
  params = { ...a.params };
  buildParamControls();
});

document.getElementById('btn-spin').addEventListener('click', e => {
  spinning = !spinning;
  e.target.textContent = spinning ? 'spin: on' : 'spin: off';
});

document.getElementById('btn-color').addEventListener('click', e => {
  colorIdx = (colorIdx + 1) % COLOR_MODES.length;
  e.target.textContent = 'color: ' + COLOR_MODES[colorIdx];
});

// Mouse rotation
cv.addEventListener('mousedown', e => {
  dragging = true;
  lastMouse = [e.clientX, e.clientY];
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMouse[0];
  const dy = e.clientY - lastMouse[1];
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  lastMouse = [e.clientX, e.clientY];
});
window.addEventListener('mouseup', () => { dragging = false; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.95 : 1.05;
  zoom = Math.max(0.2, Math.min(5, zoom));
}, { passive: false });

// Touch support
let lastTouch = null;
let lastTouchDist = null;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    lastTouch = [e.touches[0].clientX, e.touches[0].clientY];
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && lastTouch) {
    const dx = e.touches[0].clientX - lastTouch[0];
    const dy = e.touches[0].clientY - lastTouch[1];
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    lastTouch = [e.touches[0].clientX, e.touches[0].clientY];
  } else if (e.touches.length === 2 && lastTouchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    zoom *= dist / lastTouchDist;
    zoom = Math.max(0.2, Math.min(5, zoom));
    lastTouchDist = dist;
  }
}, { passive: false });
cv.addEventListener('touchend', () => {
  lastTouch = null;
  lastTouchDist = null;
});

buildPresetButtons();
loadAttractor('lorenz');
requestAnimationFrame(frame);
</script>
</body>
</html>
